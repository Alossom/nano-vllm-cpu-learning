[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A lightweight inference implementation with a CPU reference backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.14.0",
    "transformers==5.16.1",
    "numpy==2.4.6",
    "safetensors==0.8.0",
    "xxhash==4.0.1",
]

[project.urls]
Homepage = "https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.uv]
constraint-dependencies = ["tokenizers==0.23.2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
